name: Verify and publish site
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm test
      - run: npm run test:account-ui
      - run: npm run test:decks-ui
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test Firestore rules
        run: npm run test:rules
      - name: Build staged Firebase client
        run: npm run release:build
      - name: Check staged Firebase files
        run: node scripts/check-deploy-artifact.mjs
        env:
          BASE: /ls9-flashcards-site/
          ARTIFACT_DIR: dist-firebase
      - name: Check installability and offline reload
        env:
          BASE: /ls9-flashcards-site/
          APP_URL: http://127.0.0.1:4173/ls9-flashcards-site/
        run: |
          npm run preview -- --outDir dist-firebase --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node scripts/installable.mjs
      - name: Build isolated test-project rehearsal preview
        run: npm run rehearsal:build
      - name: Check rehearsal installability and offline reload
        env:
          BASE: /ls9-flashcards-site/auth-spike/rehearsal/
          APP_URL: http://127.0.0.1:4178/ls9-flashcards-site/auth-spike/rehearsal/
        run: |
          npm run preview -- --outDir dist-rehearsal --port 4178 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node scripts/installable.mjs
      - name: Build the unpublished same-context recovery bridge
        run: npm run recovery-bridge:build
      # The bridge does not seed legacy storage. installable.mjs adds one
      # synthetic due card in its disposable profile when Start is disabled.
      - name: Check recovery-bridge installability without publishing it
        env:
          BASE: /german-flashcards-site/
          APP_URL: http://127.0.0.1:4179/german-flashcards-site/
        run: |
          npm run preview -- --outDir dist-recovery-bridge --port 4179 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node scripts/installable.mjs
      - name: Verify and retain the tested candidate
        run: npm run release:verify
      - uses: actions/upload-artifact@v7
        with:
          name: firebase-candidate-${{ github.sha }}
          path: dist-firebase/
          include-hidden-files: true # .nojekyll, after the private-file check
          if-no-files-found: error
          retention-days: 14
      # Authorized 2026-10-07. Publish the Firebase client on master only.
      # Studied-data import and legacy device recovery are waived. Both gates
      # stay paired. Pages CI does not deploy Firestore rules.
      # Publish dist-firebase only. Do not publish a flag-off dist/ in its place.
      - name: Check out public site
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        uses: actions/checkout@v4
        with:
          repository: licensedsaucer9-web/ls9-flashcards-site
          ref: gh-pages
          path: public-site
          ssh-key: ${{ secrets.PUBLIC_SITE_DEPLOY_KEY }}
      - name: Publish tested files
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: |
          rsync -a --delete --exclude='.git/' --exclude='auth-spike/' --exclude='auth-spike-prod/' dist-firebase/ public-site/
          git -C public-site add -A
          if git -C public-site diff --cached --quiet; then
            echo 'Public site is already current.'
            exit 0
          fi
          git -C public-site config user.name 'github-actions[bot]'
          git -C public-site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C public-site commit -m "Publish ${GITHUB_SHA}"
          git -C public-site push origin HEAD:gh-pages
